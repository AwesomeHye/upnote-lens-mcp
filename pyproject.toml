[project]
name = "upnote-lens-mcp"
version = "0.1.0"
description = "Hybrid MCP server for UpNote — reads via the local SQLite DB, writes via the upnote:// URL scheme."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "elsboo" }]
keywords = ["mcp", "upnote", "notes", "sqlite"]
dependencies = ["mcp>=1.2.0"]

[project.urls]
Homepage = "https://github.com/AwesomeHye/upnote-lens-mcp"

[project.scripts]
upnote-lens-mcp = "upnote_lens.server:main"
upnote-lens = "upnote_lens.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/upnote_lens"]
