name: Publish (PyPI + MCP Registry)

# Tag a version to release, e.g.:
#   git tag v0.1.3 && git push origin v0.1.3
on:
  push:
    tags: ["v*"]

jobs:
  # 1) Publish the package to PyPI via Trusted Publishing (OIDC, no token).
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Verify tag matches pyproject version (fail fast)
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PYPROJECT="$(grep -E '^version' pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "tag=$TAG  pyproject=$PYPROJECT"
          if [ "$TAG" != "$PYPROJECT" ]; then
            echo "::error::Tag v$TAG does not match pyproject.toml version $PYPROJECT. Bump pyproject.toml before tagging."
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Publish to PyPI
        run: uv publish # OIDC trusted publishing (no token needed)

  # 2) Publish metadata to the official MCP Registry — only after PyPI succeeds.
  registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for MCP Registry GitHub OIDC auth
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Sync server.json version from tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' \
            server.json > server.tmp && mv server.tmp server.json
          cat server.json

      - name: Wait until the version is live on PyPI
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          for i in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/upnote-lens-mcp/$VERSION/json" >/dev/null; then
              echo "upnote-lens-mcp $VERSION is live on PyPI."
              exit 0
            fi
            echo "Attempt $i: not on PyPI yet, waiting 10s..."
            sleep 10
          done
          echo "::error::upnote-lens-mcp $VERSION never appeared on PyPI."
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
